# CI only compiles and tests. It never publishes and never regenerates
# manifest.json — zkey/VK generation is nondeterministic, so a CI rebuild would
# mint VKs that don't match what is published/registered on-chain. Releases are
# manual: see docs/RELEASE.md.
name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
    
    - name: Install Circom
      run: |
        wget https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
        chmod +x circom-linux-amd64
        sudo mv circom-linux-amd64 /usr/local/bin/circom
        circom --version
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Run linter
      run: |
        pnpm run format:check
        pnpm run lint:circom
    
    - name: Build all circuits
      run: pnpm run build-all

    # Freshly built zkeys/VKs are non-canonical throwaways (nondeterministic
    # setup) — they validate circuit logic only and are never uploaded.
    # manifest_vk_hash.test.ts self-skips here (no convert-vk); it runs locally
    # before a release. manifest_schema.test.ts validates the committed manifest.
    - name: Run tests
      run: pnpm test

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Run security audit
      run: pnpm audit --audit-level=moderate
      continue-on-error: true
    
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.before }}
        head: HEAD
        extra_args: --only-verified
